<!DOCTYPE html>
<html lang="en">

<head>
    <title>Earthquake-Tracker Backend</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        .header-container{
            width: 80%;
            margin: auto;
            overflow: hidden;
        }

        ul{
            margin: 0;
            padding: 0;
        }
        header{
            background: #35424a;
            color: #fff;
            padding-top: 30px;
            min-height: 70px;
            border-bottom: #599fff 3px solid;
        }

        header a{
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 20px;
        }


        header li{
            float: left;
            display: inline;
            padding: 0 20px;
        }

        header #branding{
            float: left;
        }

        header #branding h1{
            margin: 0;
        }

        header nav{
            float: right;
            margin-top: 14px;
            margin-right: 145px;
        }

        header .highlight, header .current a{
            color: #599fff;
            font-weight: bold;
        }

        header a:hover{
            color: #ccc;
            font-weight: bold;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            margin: 0.5em;
            padding: 0.5em;
            background-color: rgb(174, 223, 255);
            border: 0.2em solid rgb(44, 171, 255);
            border-radius: 0.2em;
        }

        .button-container {
            display: flex;
            justify-content: center;
        }

        form {
            margin: auto;
        }

        input {
            margin: 0.1em;
        }

        button {
            margin: 0.1em;
            border: 0.1em solid rgb(80, 80, 80);
            border-radius: 0.2em;
        }

        footer{
            padding: 30px;
            bottom: 0;
            color: #fff;
            background-color: #35424a;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-container">
            <div id="branding">
                <h1><span class="highlight">Earthquake</span> Tracker</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="http://127.0.0.1:5001">Home</a></li>
                    <li><a href="http://127.0.0.1:5001/table">Table</a></li>
                    <li><a href="http://127.0.0.1:5001/about">About</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div>
        <center>
            <h2>Earthquake-Tracker Control Panel</h2>
        </center>
    </div>
    <div class="form-container">
        <form action="http://localhost:5002/import_url" method="post">
            <label for="source_url">Source url:</label><br>
            <input type="text" id="source_url" name="source_url" size="100"
                value="https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_month.geojson"><br>
            <div class="button-container">
                <button type="submit" name="action" value="replace_url">Replace</button>
                <button type="submit" name="action" value="add_new_url">Add new</button>
                <button type="submit" name="action" value="add_url">Add</button>
            </div>
        </form>
    </div>
    <div class="form-container">
        <form action="http://localhost:5002/import_url" method="post">
            <label for="geojson_data">GeoJSON Data:</label><br>
            <textarea id="geojson_data" name="geojson_data" rows="24" cols="100">
{
    "features": [
        {
            "properties": {
                "mag": 3.9,
                "place": "7 km E of Stillmore, Georgia",
                "time": 1655539523720,
                "url": "https://earthquake.usgs.gov/earthquakes/eventpage/se60400186",
                "alert": "green"
            },
            "geometry": {
                "type": "Point",
                "coordinates": [
                    -82.1405,
                    32.4525,
                    0.75
                ]
            }
        }
    ]
}
            </textarea><br>
            <div class="button-container">
                <button type="submit" name="action" value="replace_json">Replace</button>
                <button type="submit" name="action" value="add_new_json">Add new</button>
                <button type="submit" name="action" value="add_json">Add</button>
            </div>
        </form>
    </div>
    <footer>
        <p>Team 4, Copyright &copy; 2022</p>
    </footer>
</body>

</html>
